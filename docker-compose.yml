services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      HTTP_ADDR: ":8080"
      JWT_SECRET: "change-me-in-production"
      JWT_EXPIRED: "24h"
      OPENAPIYAML_LOCATION: "/app/openapi.yaml"
    volumes:
      - ./openapi.yaml:/app/openapi.yaml:ro
      - db_data:/app/data
    # Healthcheck uses the login endpoint (no auth needed) so it doesn't 401
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "--post-data",
          '{"email":"cs@test.com","password":"password"}',
          "--header",
          "Content-Type:application/json",
          "http://localhost:8080/dashboard/v1/auth/login",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:
