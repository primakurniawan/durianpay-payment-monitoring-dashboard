version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      HTTP_ADDR: ":8080"
      JWT_SECRET: "change-me-in-production"
      JWT_EXPIRED: "24h"
      OPENAPIYAML_LOCATION: "/app/openapi.yaml"
    volumes:
      - ./openapi.yaml:/app/openapi.yaml:ro
      - db_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/dashboard/v1/payments"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=http://localhost:8080/dashboard/v1

volumes:
  db_data:
