openapi: 3.0.3
info:
  title: DurianPay Internal Dashboard API
  version: "1.0.0"
servers:
  - url: http://localhost:8080

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          example: 401
        message:
          type: string
          example: "Unauthenticated: missing or invalid token"

    User:
      type: object
      properties:
        email:
          type: string
        role:
          type: string
        token:
          type: string

    Payment:
      type: object
      properties:
        payment_id:
          type: string
          example: "PAY-0001"
        merchant_name:
          type: string
          example: "Tokopedia"
        status:
          type: string
          enum: [completed, processing, failed]
        amount:
          type: integer
          example: 150000
        created_at:
          type: string
          format: date-time

    Summary:
      type: object
      description: Global payment counts — always reflects full dataset regardless of active filters
      properties:
        total:
          type: integer
          example: 200
        completed:
          type: integer
          example: 118
        processing:
          type: integer
          example: 42
        failed:
          type: integer
          example: 40

    PaymentsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Payment"
        total:
          type: integer
          description: Total records matching current filter (used for pagination)
          example: 15
        summary:
          $ref: "#/components/schemas/Summary"

  responses:
    LoginResponse:
      description: JWT token and user info
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/User"
    PaymentListResponse:
      description: Paginated payment list with total count
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PaymentsResponse"
    UnauthorizedError:
      description: Authentication failed or missing credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

paths:
  /dashboard/v1/auth/login:
    post:
      summary: Login with email + password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        "200":
          $ref: "#/components/responses/LoginResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /dashboard/v1/payments:
    get:
      summary: List payments with pagination, filtering, search and sort
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [completed, processing, failed]
          description: Filter by payment status
        - in: query
          name: search
          schema:
            type: string
          description: Search by merchant name or payment ID
        - in: query
          name: sort
          schema:
            type: string
            example: "amount:desc"
          description: "Sort field and direction. Format: field:asc or field:desc. Allowed fields: created_at, amount, merchant_name, status, payment_id"
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: Number of records per page
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
            minimum: 0
          description: Number of records to skip
      responses:
        "200":
          $ref: "#/components/responses/PaymentListResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
